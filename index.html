<script>
(() => {
    "use strict";

    // =========================================================
    // CONFIG
    // =========================================================

    const PUBNUB_SUBSCRIBE_KEY = "demo";
    const PUBNUB_CHANNEL = "pixels";

    /*
     * clear_client.py automatically replaces this value.
     *
     * DO NOT put the private key here.
     */
    const PUBLIC_KEY_B64 = "zB+OixXEDO2B8Mj1bZAFrY8s6AArNBFVbUDSPRyPN7o=";


    // =========================================================
    // SETTINGS
    // =========================================================

    const MAX_COMMAND_AGE_MS = 30 * 1000;

    const usedNonces = new Set();

    let blackoutActive = false;


    // =========================================================
    // CANVAS
    // =========================================================

    let canvas = null;
    let ctx = null;


    function getCanvas() {
        if (canvas && ctx) {
            return true;
        }

        canvas = document.getElementById("canvas");

        if (!canvas) {
            console.error(
                "[CLEAR] Canvas #canvas not found."
            );
            return false;
        }

        ctx = canvas.getContext("2d");

        if (!ctx) {
            console.error(
                "[CLEAR] Could not get 2D context."
            );
            return false;
        }

        console.log(
            "[CLEAR] Canvas acquired:",
            canvas.width,
            "x",
            canvas.height
        );

        return true;
    }


    function clearCanvas() {
        if (!getCanvas()) {
            return;
        }

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }


    // =========================================================
    // BLACKOUT STATE
    // =========================================================

    function enableBlackout() {
        blackoutActive = true;

        clearCanvas();

        console.log(
            "[CLEAR] BLACKOUT ACTIVE"
        );
    }


    function disableBlackout() {
        blackoutActive = false;

        console.log(
            "[CLEAR] BLACKOUT RELEASED"
        );
    }


    // =========================================================
    // CANVAS PROTECTION
    // =========================================================

    /*
     * Do not trust the drawer.
     *
     * During blackout, normal CanvasRenderingContext2D drawing
     * operations are blocked.
     */

    function installCanvasProtection() {
        if (!getCanvas()) {
            return;
        }

        const blockedMethods = [
            "fillRect",
            "strokeRect",
            "fill",
            "stroke",
            "drawImage",
            "putImageData",
            "fillText",
            "strokeText",
            "clearRect"
        ];

        for (const method of blockedMethods) {
            const original = ctx[method];

            if (
                typeof original !== "function"
            ) {
                continue;
            }

            ctx[method] = function (...args) {

                /*
                 * clearRect is always allowed so the clear
                 * command can wipe the canvas.
                 */
                if (
                    method !== "clearRect" &&
                    blackoutActive
                ) {
                    return;
                }

                return original.apply(
                    this,
                    args
                );
            };
        }

        console.log(
            "[CLEAR] Canvas protection installed."
        );
    }


    // =========================================================
    // BASE64
    // =========================================================

    function base64ToBytes(value) {
        try {
            const binary = atob(value);

            const bytes =
                new Uint8Array(
                    binary.length
                );

            for (
                let i = 0;
                i < binary.length;
                i++
            ) {
                bytes[i] =
                    binary.charCodeAt(i);
            }

            return bytes;

        } catch (error) {
            console.error(
                "[CLEAR] Invalid base64:",
                error
            );

            return null;
        }
    }


    // =========================================================
    // SIGNED PAYLOAD
    // =========================================================

    function createPayload(
        type,
        timestamp,
        nonce
    ) {
        return (
            type +
            "|" +
            timestamp +
            "|" +
            nonce
        );
    }


    // =========================================================
    // ED25519 VERIFICATION
    // =========================================================

    async function verifySignature(message) {

        if (
            typeof message.timestamp !==
            "number"
        ) {
            return false;
        }

        if (
            typeof message.nonce !==
            "string"
        ) {
            return false;
        }

        if (
            typeof message.signature !==
            "string"
        ) {
            return false;
        }


        const age =
            Math.abs(
                Date.now() -
                message.timestamp
            );


        if (
            age >
            MAX_COMMAND_AGE_MS
        ) {
            console.warn(
                "[SECURITY] Expired command rejected."
            );

            return false;
        }


        if (
            usedNonces.has(
                message.nonce
            )
        ) {
            console.warn(
                "[SECURITY] Replay rejected."
            );

            return false;
        }


        const publicKeyBytes =
            base64ToBytes(
                PUBLIC_KEY_B64
            );

        const signatureBytes =
            base64ToBytes(
                message.signature
            );


        if (
            !publicKeyBytes ||
            !signatureBytes
        ) {
            return false;
        }


        const payload =
            createPayload(
                message.type,
                message.timestamp,
                message.nonce
            );


        const payloadBytes =
            new TextEncoder().encode(
                payload
            );


        try {

            const publicKey =
                await crypto.subtle.importKey(
                    "raw",
                    publicKeyBytes,
                    {
                        name: "Ed25519"
                    },
                    false,
                    [
                        "verify"
                    ]
                );


            const valid =
                await crypto.subtle.verify(
                    {
                        name: "Ed25519"
                    },
                    publicKey,
                    signatureBytes,
                    payloadBytes
                );


            if (valid) {
                usedNonces.add(
                    message.nonce
                );

                if (
                    usedNonces.size > 1000
                ) {
                    const first =
                        usedNonces
                            .values()
                            .next()
                            .value;

                    usedNonces.delete(
                        first
                    );
                }
            }


            return valid;

        } catch (error) {

            console.error(
                "[SECURITY] Ed25519 verification failed:",
                error
            );

            return false;
        }
    }


    // =========================================================
    // PUBNUB MESSAGE
    // =========================================================

    async function processMessage(message) {

        if (!message) {
            return;
        }

        if (
            message.type !== "clear" &&
            message.type !== "release"
        ) {
            return;
        }

        console.log(
            "[CLEAR] Received:",
            message.type
        );


        const valid =
            await verifySignature(
                message
            );


        if (!valid) {
            console.warn(
                "[SECURITY] Invalid command rejected."
            );

            return;
        }


        if (
            message.type === "clear"
        ) {
            enableBlackout();
            return;
        }


        if (
            message.type === "release"
        ) {
            disableBlackout();
        }
    }


    // =========================================================
    // PUBNUB
    // =========================================================

    function initializePubNub() {

        if (
            typeof window.PubNub !==
            "function"
        ) {
            console.error(
                "[PUBNUB] PubNub SDK not loaded."
            );

            return;
        }


        if (
            !PUBNUB_SUBSCRIBE_KEY ||
            PUBNUB_SUBSCRIBE_KEY ===
            "YOUR_SUBSCRIBE_KEY"
        ) {
            console.error(
                "[PUBNUB] Subscribe key is not configured."
            );

            return;
        }


        const pubnub =
            new window.PubNub({
                subscribeKey:
                    PUBNUB_SUBSCRIBE_KEY,

                userId:
                    "draw-on-my-face-clear-client"
            });


        pubnub.addListener({

            message(event) {

                processMessage(
                    event.message
                );

            },

            status(event) {

                console.log(
                    "[PUBNUB] Status:",
                    event.category
                );

            }

        });


        pubnub.subscribe({
            channels: [
                PUBNUB_CHANNEL
            ]
        });


        console.log(
            "[PUBNUB] Initialized."
        );

        console.log(
            "[PUBNUB] Subscribed to:",
            PUBNUB_CHANNEL
        );
    }


    // =========================================================
    // INITIALIZATION
    // =========================================================

    function initialize() {

        getCanvas();

        installCanvasProtection();

        initializePubNub();
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once: true
            }
        );

    } else {

        initialize();

    }


    // =========================================================
    // MINIMAL API
    // =========================================================

    window.DrawOnMyFace = {

        clearLocal() {
            clearCanvas();
        },

        isBlackoutActive() {
            return blackoutActive;
        }

    };

})();
</script>

<script>(() => {
    const maxTrackPoints = 40;
    const pointLifetimeMS = 5000;
    const userId = `userId-${ crypto.randomUUID() }`; // Thank you Bettlee 🎉
    const defaultStyle = "#FF00FF";
    let activeStyle = defaultStyle;
    var sendSeq = 0;

    let screenWidth = 0;
    let screenHeight = 0;
    let dirty = true;

    const userTracks = {};
    const pubnub = PubNub({});
    const channels = {
      coords   : 'coords',
      sticker  : 'sticker',
      commands : 'commands',
    };

    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const body = document.querySelector('body');

    const urlParams = new URLSearchParams(window.location.search);
    const isOverlayMode = urlParams.get('overlay') === 'true';

    if (isOverlayMode) {
        body.style.backgroundColor = 'transparent';
    }

    function setColor(hex) {
        activeStyle = hex;
    }

    function resizeCanvas() {
      screenWidth = window.innerWidth;
      screenHeight = window.innerHeight;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(screenWidth * ratio);
      canvas.height = Math.round(screenHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      Object.keys(userTracks).forEach(id => rebuildPaths(userTracks[id]));
      dirty = true;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function stickerReceiver(message) {
        const x = message.x * screenWidth;
        const y = message.y * screenHeight;
        const div = document.createElement('div');
        div.classList.add('sticker');
        div.style.top = `${y-20}px`;
        div.style.left = `${x-20}px`;
        div.innerHTML = '&#10084;&#65039;';
        div.setAttribute('time', +new Date());
        document.body.appendChild(div);
    }

    // Recieve Stickers
    pubnub.subscribe({
        channel: channels.sticker,
        messages: stickerReceiver,
    });

    // Sticker Clicker
    window.addEventListener('click', (event) => {
        const message = {
            x: event.clientX / screenWidth,
            y: event.clientY / screenHeight,
            userId: userId,
        };
        pubnub.publish({
            channel: channels.sticker,
            message: message,
        });

        event.preventDefault();
        return false;
    });
    setInterval( () => {
        document.querySelectorAll('.sticker').forEach( div => {
            let now = +new Date();
            let drawTime = +div.getAttribute('time');
            if (now > drawTime + 3000) {
                body.removeChild(div);
            }
        } );
    }, 1000 );
    // Clear screen of Stickers

    // Prevent mobile scroll
    body.addEventListener('touchmove', (event) => {
        event.preventDefault();
        return false;
    }, { passive: false }); 

    let pendingPoint = null;
    window.addEventListener('pointermove', (event) => {
        event.preventDefault();
        pendingPoint = {
            x: event.clientX / screenWidth,
            y: event.clientY / screenHeight,
        };
        return false;
    });

    function publishPendingPoint() {
        if (!pendingPoint) return;
        sendSeq++;

        const message = {
            x: pendingPoint.x,
            y: pendingPoint.y,
            userId: userId,
            style: activeStyle,
            seq: sendSeq,
        };
        pendingPoint = null;

        pubnub.publish({
            channel: channels.coords,
            message: message,
        });
    }

    // Recieve Paint Events
    pubnub.subscribe({
        channel: channels.coords,
        messages: addUserTrack,
    });

    function addUserTrack(message) {
        if (typeof message.x != 'number') return;
        if (typeof message.y != 'number') return;

        const id = message.userId;
        if (!(id in userTracks)) userTracks[id] = { points: [], paths: [] };
        const track = userTracks[id];
        message.expires = Date.now() + pointLifetimeMS;
        track.points.push(message);

        // Backwards compatibility for versions before seq was added
        const allHaveSeq = track.points.every(point => typeof point.seq === 'number');
        if (allHaveSeq) {
            track.points.sort((a, b) => a.seq - b.seq);
        }

        // Truncate to maxTrackPoints points only
        if (track.points.length > maxTrackPoints) track.points.shift();

        rebuildPaths(track);
        dirty = true;
    }

    function rebuildPaths(track) {
        const points = track.points;
        const paths = track.paths;
        paths.length = 0;
        if (points.length == 0) return;

        let path = null;
        let style = null;
        let previousX = 0;
        let previousY = 0;

        points.forEach( point => {
            const x = point.x * screenWidth;
            const y = point.y * screenHeight;
            const pointStyle = point.style || defaultStyle;

            if (pointStyle !== style) {
                const first = path === null;
                style = pointStyle;
                path = new Path2D();
                paths.push({ style: style, path: path });
                path.moveTo(first ? x : previousX, first ? y : previousY);
            }

            path.lineTo(x, y);
            previousX = x;
            previousY = y;
        } );
    }

    // Drop line segments older than pointLifetimeMS
    function expirePoints() {
        const now = Date.now();
        Object.keys(userTracks).forEach( id => {
            const track = userTracks[id];
            let expired = false;
            while (track.points.length && track.points[0].expires <= now) {
                track.points.shift();
                expired = true;
            }
            if (!expired) return;
            rebuildPaths(track);
            dirty = true;
        } );
    }

    function render() {
        requestAnimationFrame(render);
        publishPendingPoint();
        expirePoints();

        if (!dirty) return;
        dirty = false;

        context.clearRect(0, 0, screenWidth, screenHeight);

        context.lineWidth = 3;
        context.lineJoin = 'round';
        context.lineCap = 'round';

        Object.keys(userTracks).forEach( id => {
            const paths = userTracks[id].paths;
            for (let index = 0; index < paths.length; index++) {
                context.strokeStyle = paths[index].style;
                context.stroke(paths[index].path);
            }
        } );
    }
    requestAnimationFrame(render);

    // For Web Manifest
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
})();</script>
